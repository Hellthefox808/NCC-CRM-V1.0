<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 64" width="128" height="64">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
    <linearGradient id="gold-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE16D"/>
      <stop offset="50%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#E9C400"/>
    </linearGradient>
  </defs>

  <!-- Left Circle: Sarala Birla University Emblem -->
  <g filter="url(#shadow)">
    <circle cx="36" cy="32" r="26" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2.5"/>
    <!-- SBU Emblem Graphic -->
    <circle cx="26" cy="32" r="10" fill="#EA580C" opacity="0.9"/>
    <circle cx="26" cy="32" r="6" fill="#FFFFFF"/>
    <path d="M 38 22 L 48 22 L 48 26 L 40 26 L 40 30 L 46 30 L 46 34 L 40 34 L 40 42 L 38 42 Z" fill="#0284C7"/>
    <text x="36" y="49" font-family="system-ui, sans-serif" font-weight="800" font-size="6" fill="#1E293B" text-anchor="middle" letter-spacing="0.5">SBU RANCHI</text>
  </g>

  <!-- Right Circle: 19 JHR BN NCC Crest (Overlapping) -->
  <g filter="url(#shadow)">
    <circle cx="76" cy="32" r="26" fill="#121414" stroke="#FFFFFF" stroke-width="3"/>
    <circle cx="76" cy="32" r="25" fill="none" stroke="url(#gold-border)" stroke-width="1.5"/>
    
    <!-- Tricolor Shield Inside NCC Circle -->
    <path d="M 64 16 L 72 16 L 72 48 L 64 48 Z" fill="#1E3A8A"/>
    <path d="M 72 12 L 80 12 L 80 52 L 72 52 Z" fill="#DC2626"/>
    <path d="M 80 16 L 88 16 L 88 48 L 80 48 Z" fill="#0284C7"/>
    
    <!-- Gold Star -->
    <polygon points="76,22 78,26 82,27 79,30 80,34 76,32 72,34 73,30 70,27 74,26" fill="url(#gold-border)"/>
    
    <!-- 19 JHR Text -->
    <text x="76" y="44" font-family="system-ui, sans-serif" font-weight="900" font-size="7" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">19 JHR</text>
  </g>
</svg>
