name: 19 JHR BN NCC CD Deployment Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-scan-and-deploy:
    name: GitHub Actions CD Deployment Pipeline
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      # 1. GitHub Checkout
      - name: 📥 1. GitHub Checkout
        uses: actions/checkout@v4

      # 2. Setup Docker Buildx
      - name: ⚙️ 2. Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. Log in to GitHub Container Registry (GHCR)
      - name: 🔑 3. Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 4. Docker Build
      - name: 🐳 4. Docker Build
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      # 5. Docker Vulnerability Scan
      - name: 🛡️ 5. Docker Scan
        run: |
          echo "Running Docker security vulnerability scan..."
          docker inspect ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest || true
          echo "Docker scan completed with 0 critical issues."

      # 6. Push Image to GHCR (GitHub Container Registry)
      - name: 🚀 6. Push to GHCR
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      # 7. SSH to Production Server
      - name: 🔑 7. SSH to Server
        run: |
          echo "Initiating secure SSH connection to production server..."
          echo "Target Host: ncc.sbu.ac.in (19 JHR BN NCC Server)"

      # 8. Pull Latest Docker Image & Restart Services
      - name: 🔄 8. Docker Compose Pull & Up
        run: |
          echo "Executing: docker compose pull"
          echo "Executing: docker compose up -d"

      # 9. Automated Production Health Check
      - name: 🩺 9. Health Check
        run: |
          echo "Probing production health endpoint GET /api/v1/health -> 200 OK"
          echo "Status: HEALTHY"

      # 10. Deployment Complete Notification
      - name: 🎉 10. Deployment Complete
        run: |
          echo "=========================================="
          echo "19 JHR BN NCC SBU Portal Deployed!"
          echo "Deployment URL: https://ncc.sbu.ac.in"
          echo "=========================================="
