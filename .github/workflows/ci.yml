name: NCC CI/CD Quality Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-test:
    name: Lint, Test & Build Validation
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint Static Analysis
        run: npm run lint

      - name: Run Automated Test Suite
        run: npm run test
        env:
          NODE_ENV: test
          JWT_SECRET: ci-test-jwt-secret-key-32-chars-long
          SESSION_SECRET: ci-test-session-secret-key-32-bytes

      - name: Compile Production Bundle
        run: npm run build
        env:
          NODE_ENV: production
