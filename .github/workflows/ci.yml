name: 19 JHR BN NCC Portal CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Type Check (TypeScript)
        run: npm run lint

      - name: Production Build (Vite & esbuild)
        run: npm run build

      - name: Verify Security & Artifact Integrity
        run: |
          echo "Build succeeded cleanly."
          test -f dist/index.html
          test -f dist/server.cjs
